[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pubfig-research-prototype"
version = "0.4.0"
description = "A research prototype for reproducible, publication-oriented scientific figures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PubFig research prototype contributors"}]
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "Pillow>=9"]
demo = ["streamlit>=1.32"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
